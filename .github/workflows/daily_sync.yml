name: Daily Data Download and Sync
permissions:
  contents: read

on:
  schedule:
    # GitHub Actions cron is ALWAYS UTC. Jakarta (WIB) is UTC+7 with no DST,
    # so every time below is 7 hours behind the intended WIB wall clock.
    #   06:00 WIB -> 23:00 UTC (previous day)
    #   09:00 WIB -> 02:00 UTC
    #   12:00 WIB -> 05:00 UTC
    #   15:00 WIB -> 08:00 UTC
    #   17:00 WIB -> 10:00 UTC
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
    - cron: '0 5 * * *'
    - cron: '0 8 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger
    inputs:
      manual_reason:
        description: 'Reason for running manually'
        required: false
        default: 'Manual test'

# Five runs per day can overlap if one hangs (login stall, slow NAS upload),
# which would double-load Postgres/MotherDuck. Serialise them instead.
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync_data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily/requirements.txt
          playwright install chromium --with-deps
      - name: Run Daily Ingestion Script
        env:
          PYTHONPATH: ${{ github.workspace }}
          CPS_USERNAME: ${{ secrets.CPS_USERNAME }}
          CPS_PASSWORD: ${{ secrets.CPS_PASSWORD }}
          NAS_DOMAIN: ${{ secrets.NAS_DOMAIN }}
          NAS_USERNAME: ${{ secrets.NAS_USERNAME }}
          NAS_PASSWORD: ${{ secrets.NAS_PASSWORD }}
          NAS_PORT: ${{ secrets.NAS_PORT }}
          DAILY_PATH: ${{ secrets.DAILY_PATH }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          BQ_TABLE_PO: ${{ secrets.BQ_TABLE_PO }}
          BQ_TABLE_RFM: ${{ secrets.BQ_TABLE_RFM }}
          BQ_TABLE_TL: ${{ secrets.BQ_TABLE_TL }}

          SCRAPPER_PATH: ${{ secrets.SCRAPPER_PATH }}
          BQ_TABLE_PO_R: ${{ secrets.BQ_TABLE_PO_R }}
          BQ_TABLE_TL_R: ${{ secrets.BQ_TABLE_TL_R }}
          BQ_TABLE_INVENTORY_HO: ${{ secrets.BQ_TABLE_INVENTORY_HO }}

          WEEKLY_PATH: ${{ secrets.WEEKLY_PATH }}
          BASE_LAKE: ${{ secrets.BASE_LAKE }}
          SERVING_DB: ${{ secrets.SERVING_DB }}
          MD_TOKEN: ${{ secrets.MD_TOKEN }}
          MD_DATABASE: ${{ secrets.MD_DATABASE }}
          MD_SCHEMA: ${{ secrets.MD_SCHEMA }}
        run: python daily/automation.py
      - name: Upload Failure Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-screenshot
          path: downloads/failure_screenshot.png