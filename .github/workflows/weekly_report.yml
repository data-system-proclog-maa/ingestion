name: Weekly Data Download and Process
permissions:
  contents: read

on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch: # Allows manual trigger
    inputs:
      manual_reason:
        description: 'Reason for running manually'
        required: false
        default: 'Manual test'

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily/requirements.txt
          # This installs the purchasing-weekly package globally in the runner
          pip install git+https://github.com/data-system-proclog-maa/purchasing-weekly.git@main
          playwright install chromium --with-deps
      - name: Run Weekly Ingestion Script
        env:
          PYTHONPATH: ${{ github.workspace }}
          CPS_USERNAME: ${{ secrets.CPS_USERNAME }}
          CPS_PASSWORD: ${{ secrets.CPS_PASSWORD }}
          NAS_DOMAIN: ${{ secrets.NAS_DOMAIN }}
          NAS_USERNAME: ${{ secrets.NAS_USERNAME }}
          NAS_PASSWORD: ${{ secrets.NAS_PASSWORD }}
          NAS_PORT: ${{ secrets.NAS_PORT }}
          DAILY_PATH: ${{ secrets.DAILY_PATH }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          BQ_TABLE_PO: ${{ secrets.BQ_TABLE_PO }}
          BQ_TABLE_RFM: ${{ secrets.BQ_TABLE_RFM }}
          BQ_TABLE_TL: ${{ secrets.BQ_TABLE_TL }}

          SCRAPPER_PATH: ${{ secrets.SCRAPPER_PATH }}
          BQ_TABLE_PO_R: ${{ secrets.BQ_TABLE_PO_R }}
          BQ_TABLE_TL_R: ${{ secrets.BQ_TABLE_TL_R }}
          BQ_TABLE_INVENTORY_HO: ${{ secrets.BQ_TABLE_INVENTORY_HO }}

          WEEKLY_PATH: ${{ secrets.WEEKLY_PATH }}
          BASE_LAKE: ${{ secrets.BASE_LAKE }}
          
        run: python weekly/weekly_report.py